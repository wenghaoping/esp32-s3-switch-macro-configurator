name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `pio run` invokes scripts/embed_web_assets.py, which runs the Vite
      # build to embed the browser console in Flash. Install dependencies
      # before both the host-side tests and the firmware build.
      - name: Install Node.js dependencies
        run: npm ci

      - name: Run host-side tests
        run: npm test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19

      - name: Build ESP32-S3 firmware
        run: pio run
